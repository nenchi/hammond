services:
  hammond:
    image: ghcr.io/nenchi/hammond:latest
    container_name: hammond
    environment:
      # optional: without it a random secret is generated once and kept in /config/jwt_secret
      - JWT_SECRET=somethingverystrong
    volumes:
      - /path/to/config:/config
      - /path/to/data:/assets
    ports:
      - 3000:3000
    restart: unless-stopped
